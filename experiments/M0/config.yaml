# M0 — 条件 1：冻结 π0.5 在官方流程下按"每块执行前 N 步"扫描（docs/design/vla_harness_v1.md §5 M0 列、§3.2、§6）
# 数值照设计 §5；改动任何数值 = 改预注册，必须走 Research OS experiment amend（会标 post_hoc_amended）。
milestone: M0
condition: 条件 1
design_refs: ["§5 M0", "§3.2 划分", "§3.3 ε 校准", "§6 证伪条件 5", "§8.4 #2 #3 #4"]

tasks:
  dev: [stack_bowls, put_bottles_into_dustbin]
  heldout: [build_tower, make_kong]
  heldout_policy: best_N_only        # 留出任务只跑最佳 N（N* 在开发任务 seed 0/1 上选定后才跑）
  reserve: [fold_clothes]            # 替补，不在 M0 跑
step_lim: {stack_bowls: 800, put_bottles_into_dustbin: 700, build_tower: 1050, make_kong: 600}

splits_file: experiments/splits.json  # scripts/make_split.py 生成
seeds: [0, 1]                         # seed 0 = E，seed 1 = V（§3.2）
eval_num: 50                          # 每 seed 每任务 50 回合（布局 0–49）

sweep:
  key: n                              # Research OS slot key（view.json cols.key）
  exec_steps_N: [5, 10, 15, 25, 50]   # π0.5 块长 50，取前 N 步执行后重新推理
  chunk_len: 50
  select_N_star: "开发任务 seed 0/1 合并 200 回合 SR 最高的 N；平手取更大的 N（推理次数少）"   # 设计未写选法，本预注册补充

aa:                                   # §3.2 A/A：现任在 V 上重跑 3 次，M0 现任 = π0.5 @ N*
  reps: 3
  split: V
  seed: 1
  tasks: [stack_bowls, put_bottles_into_dustbin]
  incumbent: pi05_nstar
  eps_rule: "eps = max(4, max_{a<b} |S_a - S_b| + 1)，S_i 为第 i 次重跑在 V（100 回合）上的成功数"   # §3.3
  eps_min: 4                          # frozen gate.eps_min
  eps_max: 15                         # frozen gate.eps_max；超过则 V 扩到 150（§5 M3 卡点）

verifier_offline:                     # §5：验证器离线跑 M0 录像，对官方 judge 量 FPR/FNR
  fpr_max: 0.05                       # frozen verifier.fpr_max；FPR = 验证器 Pass 而官方失败 / 官方失败回合
  fnr: record_only
  source: "M0 全部回合录像 + traces/；官方 judge 来自 P5 summarize"
  research_slot: "E-M0 辅助槽 stage=verifier_audit：successes = 验证器 Pass 且官方失败，trials = 官方失败 → success_rate 读作 FPR"

eval:
  bench: RoboDojo
  env_cfg: arx_x5
  action_type: joint                  # π0.5 官方 ckpt 输出 14 维关节
  eval_batch_planned: true            # §5 M0：批量 eval_batch:true，num_envs 4
  num_envs_planned: 4
  eval_batch: false                   # 实际：Etude 适配器只支持 eval_batch:false（deploy/XPolicyLab/policy/Etude/README.md Known gaps 3）
  num_envs: 1                         # 本机 16 GB 也只能 1（§8.1 #1）；墙钟会超过 12 h 上限，见 prereg.md
  request_timeout_s: 1800

model:
  policy: pi05
  checkpoint_hf: "dataset=RoboDojo-Benchmark/RoboDojo@35efbc7dedfdbeeb6e95fb749bd885d73d483e41:ckpt/RoboDojo/Pi_05/RoboDojo-sim-arx_x5-joint-0/59999"
  checkpoint_local: "~/models/robodojo-ckpt/ckpt/RoboDojo/Pi_05/RoboDojo-sim-arx_x5-joint-0/59999"
  train_config: pi05_base_aloha_full_sim_arx-x5_seed_0
  planner: null                       # M0 无 VLM
  editor: null

budget:                               # 上限；超过即停并记录
  episodes:
    sweep: 1000                       # 2 任务 × 5 N × 2 seed × 50
    heldout_best_N: 200               # 2 任务 × 1 N × 2 seed × 50
    aa: 300                           # 3 次 × 2 任务 × 50（§5 预算行未单列 A/A，单独记）
  vlm_calls_per_episode: 0
  vlm_usd_cap: 0
  wall_hours_cap: 12                  # §5："约 1000+200 回合，无 VLM，批量 ≈ 12 h"

checkpoints_to_clear:                 # §5 M0 卡点
  - π0.5 单独跑通官方流程
  - 单回合墙钟实测（t_step，§3.4；>0.2 s 则本机每轮 >14 h，§8.4 #3）
  - 夹爪访问器可用（gripper_width_measured，§8.1 #3）
  - N=50 行与官方 11.44 对齐核对（§8.4 #2，seed 0 复跑）

metrics: [success_rate, successes, trials, score, wall_s_per_episode, t_step_s]

research:
  intent: "冻结 π0.5 官方流程下，每块执行前 N∈{5,10,15,25,50} 步对 SR 的影响；选 N*；记 t_step 与 A/A 的 δ；量验证器对官方 judge 的 FPR/FNR"
  decision_rule: "跑完、t_step 与 A/A 的 δ 记下；FPR ≤5%（否则验证器先修）"
  baseline: "π0.5 joint-0/59999 官方流程（N=50 行，对照官方榜 11.44）"
  aa_intent: "现任 π0.5@N* 在 V（seed 1，开发任务 100 回合）上重跑 3 次，得 δ_AA 与 ε"
  aa_decision_rule: "eps = max(4, max|S_a−S_b| + 1)；eps ≤ 15，否则 V 扩到 150"
  experiment: null                    # 用户 `experiment create` 后填 E-n
  aa_experiment: null
  kind: search
  aa_kind: replication
  metric: success_rate
  view: experiments/M0/view.json
  aa_view: experiments/M0/view_aa.json
  slot_keys: [task, n, seed]
  aa_slot_keys: [task, condition, rep]
  checkpoint_env: RESEARCH_CHECKPOINT  # model=<OWNER>/<NAME>@<REV40>:<path>：用户自有 HF model 仓库镜像官方 ckpt；--archive-to 取同一仓库（Research OS rules._plan_violations）
  entry: scripts/run_m0.sh            # adapter 组件提供
