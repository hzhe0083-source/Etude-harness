# M3 — 条件 4：harness 回路逐面进化 + 最终 T（docs/design/vla_harness_v1.md §5 M3 列、§3.0–§3.5、§6 条件 4 与停止规则）
milestone: M3
condition: 条件 4
design_refs: ["§5 M3", "§3.1 harness 回路", "§3.3 evolve_round", "§3.4 每轮预算", "§4 lineage 收据", "§6"]

surfaces:                             # 一次只开一个面，按此顺序（§1、§3.1）
  key: surface
  order: [planner_prompt, recovery_rules, skill_md]
  files:
    planner_prompt: evolvable/prompts/planner.md
    recovery_rules: evolvable/rules/recovery.yaml
    skill_md: evolvable/skills/SKILL.md
  rounds_per_surface_max: 4           # §5："三个面各 R≤4 轮"

candidates:
  key: candidate
  # incumbent_vK = 该面第 K 次 accept 后的现任（v0 = 该面开始时的现任）在 V 上的重跑；每个现任版本一个格子，
  # 所以 accept 后重跑 V 不会覆盖上一个现任的 Run（R40/R41 一个格子一个当前 Run）。r1–r4 = 本面各轮候选。
  values: [incumbent_v0, incumbent_v1, incumbent_v2, incumbent_v3, incumbent_v4, r1, r2, r3, r4]
  per_round: 1                        # 每轮 1 个候选、1 个面

edit_budget:
  diff_max_lines: 40                  # frozen gate.diff_max_lines
  diff_max_rules: 3                   # frozen gate.diff_max_rules（RRSI L0 退火 3→1）

gates:                                # §3.1 门行，阈值全部来自 frozen/params/thresholds.yaml
  L0: "schema、AST 禁读、泄漏正则、diff 预算"
  L1: {episodes_max: 5, layouts: "E 上 medoid 布局", rule: "全过"}
  L2: {episodes_max: 20, failures_max: 1, set: "历史回归集 F"}
  L3: {split: V, episodes: 100, rule: "b − c ≥ ε 且 McNemar 单侧 p ≤ 0.05", eps_from: "M1 A/A"}
  cost: "ΔC ≤ β0 + β1·ΔSR（RRSI §3.3）"
  seed_map: {"0": "L2 历史回归（E）；L1 medoid 重跑用 seed=0 + 辅助槽 stage=L1", "1": "L3 配对（V）"}
  aux_stages: {L1: "stage=L1（seed 0）"}
  incumbent_v: "accept 后新现任在 V 上重跑（§3.3 incumbent_cache = rerun(V)）记在格子 (surface, incumbent_vK, seed=1)"

stop_rules:                           # §6 停止规则 → 冻结现任，进入 T
  consecutive_rejects: 3              # frozen gate.stop_after_rejects
  max_V_reuse: 6                      # frozen gate.max_V_reuse
  eps_max: 15                         # ε > 15 → 停（或 V 扩到 150，§5 M3 卡点）
  budget_exhausted: true

final_T:                              # 只看一次
  conditions: [h2_frozen, h_star]     # H* 对冻结 H2
  slices:
    dev: {tasks: [stack_bowls, put_bottles_into_dustbin], seeds: [2]}
    heldout: {tasks: [build_tower, make_kong], seeds: [0, 1, 2]}
  eval_num: 50
  rule: "T 上 H* − H2 ≥ ε（配对）"
  view: experiments/M3/view_T.json

falsification_extra:
  m2_plus: "§6：M2+ = M2 用同等额外回合扩记忆；H* − M2+ < ε → 进化不值。比较集设计未写明（TBD，见 prereg.md）"

model:
  policy: pi05
  checkpoint_hf: "dataset=RoboDojo-Benchmark/RoboDojo@35efbc7dedfdbeeb6e95fb749bd885d73d483e41:ckpt/RoboDojo/Pi_05/RoboDojo-sim-arx_x5-joint-0/59999"
  planner: claude-sonnet-5-5
  editor: claude-opus-5-5             # P6，另一个 pi-mono 会话，git worktree，只写 evolvable/
  vlm_calls_per_episode_max: 12

eval:
  bench: RoboDojo
  env_cfg: arx_x5
  action_type_label: ee
  eval_batch: false
  num_envs: 1
  request_timeout_s: 1800

budget:
  rounds_max: 12                      # 3 面 × 4 轮
  episodes_per_round: 125             # §3.1/§3.4：L1 5 + L2 20 + L3 100
  hours_per_round: 8                  # §3.4 本机配置
  T_episodes_per_condition: 400       # 2×1×50 + 2×3×50
  wall_hours_cap: 123                 # §5："12 轮×8 h ≈ 96 h + T 400 回合 ≈ 27 h"
  usd_cap: 700                        # §5："约 $700"

checkpoints_to_clear:                 # §5 M3 卡点
  - "A/A 给出的 ε 不能大于 15，否则 V 扩到 150"

metrics: [success_rate, successes, trials, score, vlm_tokens_per_ep, wall_per_ep_s]

research:
  intent: "harness 回路按 规划 prompt → 恢复规则 → SKILL.md 逐面进化，每面 R≤4 轮，过 L0–L3 门"
  decision_rule: "每面至少 1 次 accept；T 上 H* − H2 ≥ ε（seed 2 + 留出）"
  baseline: "冻结 H2（M2 现任）"
  t_intent: "最终一次 T：H* 对冻结 H2，开发任务 seed 2 + 留出任务 seed 0/1/2"
  t_decision_rule: "T 上 H* − H2 ≥ ε（配对）；< ε 记 M3 证伪，保留 H2"
  experiment: null
  t_experiment: null
  kind: search
  t_kind: main
  metric: success_rate
  view: experiments/M3/view.json
  t_view: experiments/M3/view_T.json
  slot_keys: [surface, candidate, seed]
  t_slot_keys: [task, condition, seed]
  checkpoint_env: RESEARCH_CHECKPOINT  # 见 M0/config.yaml
  entry: scripts/run_harness.sh
  receipt_field: Receipt.research_run # lineage 收据记 Run 标签
