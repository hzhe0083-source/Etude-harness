[project]
name = "etude"
version = "0.1.0"
description = "VLA harness v1: frozen pi0.5 + editable harness on RoboDojo (docs/design/vla_harness_v1.md)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pyyaml",
    "jsonschema",
    "msgpack",
    "websockets",
    "pillow",
    "opencv-python-headless",
    "mcp",
    "httpx",
    "anyio",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etude"]
